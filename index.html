<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vizag Schools</title>
    <style>
      :root {
        --primary: #155eef;
        --primary-dark: #0e3ea8;
        --secondary: #22c7a9;
        --accent: #ff8a34;
        --bg: #ffffff;
        --surface: #f8fafc;
        --soft: #eff6ff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef5ff, #ffffff 42%, #ecfdf5);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .stage {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 22px;
      }

      .phone {
        width: min(420px, 100%);
        height: min(900px, calc(100vh - 44px));
        min-height: 720px;
        overflow: hidden;
        position: relative;
        border: 10px solid #101827;
        border-radius: 42px;
        background: var(--bg);
        box-shadow: 0 35px 90px rgba(15, 23, 42, 0.24);
      }

      .screen {
        display: none;
        height: 100%;
        overflow-y: auto;
        padding: 22px 18px 110px;
        scrollbar-width: none;
      }

      .screen::-webkit-scrollbar {
        display: none;
      }

      .screen.active {
        display: block;
      }

      .splash {
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #ffffff, #eff6ff, #ecfdf5);
        padding-bottom: 42px;
      }

      .logo-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--primary), #3b82f6);
        color: white;
        font-size: 28px;
        font-weight: 900;
        box-shadow: var(--shadow);
      }

      .splash .logo-mark {
        width: 88px;
        height: 88px;
        animation: pulse 1.8s ease-in-out infinite;
        border-radius: 28px;
        font-size: 40px;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      .brand-title {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .brand-subtitle,
      .muted {
        color: var(--muted);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 26px;
      }

      .icon-btn {
        display: grid;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        place-items: center;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 34px;
        line-height: 1.05;
        font-weight: 950;
        letter-spacing: 0;
      }

      h2 {
        font-size: 22px;
        font-weight: 950;
        letter-spacing: 0;
      }

      h3 {
        font-size: 17px;
        font-weight: 900;
      }

      .lead {
        margin-top: 10px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 58px;
        margin-top: 20px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: white;
        box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
      }

      .search input {
        width: 100%;
        border: 0;
        outline: 0;
        color: var(--text);
        font-weight: 700;
      }

      .filter {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 999px;
        background: var(--soft);
        color: var(--primary);
      }

      .hero-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 18px;
        padding: 18px;
        border-radius: 26px;
        background: linear-gradient(135deg, var(--primary), #3b82f6);
        color: white;
        box-shadow: var(--shadow);
      }

      .hero-card small {
        color: rgba(255, 255, 255, 0.74);
        font-weight: 900;
        text-transform: uppercase;
      }

      .hero-card h2 {
        margin-top: 6px;
        color: white;
        font-size: 21px;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 30px 0 14px;
      }

      .link-btn {
        border: 0;
        background: transparent;
        color: var(--primary);
        cursor: pointer;
        font-weight: 900;
      }

      .h-scroll {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }

      .h-scroll::-webkit-scrollbar {
        display: none;
      }

      .featured {
        position: relative;
        width: 280px;
        height: 350px;
        flex: 0 0 auto;
        overflow: hidden;
        border-radius: 28px;
        background: #dbeafe;
        box-shadow: var(--shadow);
        cursor: pointer;
      }

      .featured img,
      .school-card img,
      .gallery img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-shade {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.03), rgba(15, 23, 42, 0.78));
        color: white;
      }

      .rating {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        width: max-content;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        color: var(--text);
        font-size: 13px;
        font-weight: 900;
      }

      .card-title {
        color: white;
        font-size: 25px;
        font-weight: 950;
        line-height: 1.08;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: white;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        color: var(--text);
        cursor: pointer;
        font-weight: 900;
      }

      .chip.active {
        border-color: var(--primary);
        background: var(--primary);
        color: white;
      }

      .list {
        display: grid;
        gap: 15px;
      }

      .school-card {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 26px;
        background: white;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
        cursor: pointer;
      }

      .school-img {
        position: relative;
        height: 165px;
      }

      .save {
        position: absolute;
        top: 14px;
        right: 14px;
        display: grid;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        cursor: pointer;
        place-items: center;
      }

      .school-body {
        padding: 15px;
      }

      .school-top {
        display: flex;
        gap: 10px;
        justify-content: space-between;
      }

      .fees {
        color: var(--primary);
        white-space: nowrap;
        font-size: 13px;
        font-weight: 950;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .onboarding-art {
        display: grid;
        height: 320px;
        margin-top: 28px;
        place-items: center;
        border-radius: 40px;
        background: linear-gradient(135deg, var(--primary), #3b82f6);
        color: white;
        font-size: 70px;
        box-shadow: var(--shadow);
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 28px 0 18px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #d1d5db;
      }

      .dot.active {
        width: 30px;
        background: var(--primary);
      }

      .primary-btn,
      .outline-btn {
        width: 100%;
        min-height: 56px;
        border-radius: 22px;
        cursor: pointer;
        font-weight: 950;
      }

      .primary-btn {
        border: 0;
        background: var(--primary);
        color: white;
      }

      .outline-btn {
        border: 1px solid var(--border);
        background: white;
        color: var(--text);
      }

      .form {
        display: grid;
        gap: 14px;
        margin-top: 28px;
      }

      .input {
        width: 100%;
        min-height: 56px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 18px;
        outline-color: var(--primary);
        background: white;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-weight: 800;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--border);
      }

      .detail-hero {
        position: relative;
        height: 405px;
        margin: -22px -18px 0;
        overflow: hidden;
      }

      .detail-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .detail-copy {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 18px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.82));
        color: white;
      }

      .detail-copy h1 {
        color: white;
      }

      .quick-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: -36px;
        position: relative;
        z-index: 2;
      }

      .action-card,
      .info-strip,
      .panel,
      .admin-card,
      .compare-card {
        border: 1px solid var(--border);
        border-radius: 24px;
        background: white;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      }

      .action-card {
        display: grid;
        min-height: 82px;
        place-items: center;
        color: var(--primary);
        font-size: 13px;
        font-weight: 950;
      }

      .info-strip {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1px;
        margin-top: 18px;
        overflow: hidden;
      }

      .info-cell {
        padding: 14px;
        background: white;
      }

      .label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 950;
        text-transform: uppercase;
      }

      .value {
        margin-top: 4px;
        font-weight: 950;
      }

      .panel {
        margin-top: 14px;
        padding: 16px;
      }

      .facility-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .facility {
        padding: 10px 12px;
        border-radius: 16px;
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        font-weight: 850;
      }

      .gallery {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .gallery img {
        width: 154px;
        height: 110px;
        flex: 0 0 auto;
        border-radius: 18px;
      }

      .map {
        display: grid;
        min-height: 170px;
        place-items: center;
        border-radius: 24px;
        background: linear-gradient(135deg, #e0f2fe, #ecfdf5);
        text-align: center;
      }

      .tabbar {
        position: absolute;
        right: 18px;
        bottom: 18px;
        left: 18px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
        z-index: 10;
      }

      .tab {
        display: grid;
        min-height: 46px;
        place-items: center;
        border: 0;
        border-radius: 18px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
        font-weight: 950;
      }

      .tab.active {
        background: var(--primary);
        color: white;
        font-size: 13px;
      }

      .compare-row {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 6px;
      }

      .compare-card {
        min-width: 170px;
        padding: 15px;
      }

      .compare-line {
        padding: 10px 0;
        border-top: 1px solid var(--border);
      }

      .empty {
        display: grid;
        margin-top: 24px;
        padding: 36px 22px;
        place-items: center;
        border-radius: 28px;
        background: var(--surface);
        text-align: center;
      }

      .admin-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 18px;
      }

      .admin-card {
        padding: 16px;
      }

      .admin-action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: white;
        cursor: pointer;
      }

      .skeleton {
        overflow: hidden;
        height: 260px;
        border-radius: 26px;
        background: linear-gradient(90deg, #e2e8f0, #f8fafc, #e2e8f0);
        background-size: 220% 100%;
        animation: shimmer 1.4s infinite;
      }

      @keyframes shimmer {
        to {
          background-position: -220% 0;
        }
      }

      @media (max-width: 460px) {
        .stage {
          padding: 0;
        }

        .phone {
          width: 100vw;
          height: 100vh;
          min-height: 100vh;
          border: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="phone" aria-label="Vizag Schools mobile prototype">
        <div id="app"></div>
        <nav class="tabbar" id="tabs" aria-label="Main navigation">
          <button class="tab active" data-screen="home">Home</button>
          <button class="tab" data-screen="search">Search</button>
          <button class="tab" data-screen="favorites">Heart</button>
          <button class="tab" data-screen="profile">Profile</button>
        </nav>
      </section>
    </main>

    <script>
      const schools = [
        {
          id: "oakridge",
          name: "Oakridge International School",
          board: "International",
          locality: "Rushikonda",
          distance: "3.2 km",
          rating: 4.8,
          fees: "₹2.4L - ₹4.8L",
          status: "Open",
          tagline: "Global learning with coastal campus energy",
          image: "https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=1400&auto=format&fit=crop",
          gallery: [
            "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1596495578065-6e0763fa1178?q=80&w=1200&auto=format&fit=crop"
          ],
          facilities: ["Smart Classes", "Transport", "Sports Complex", "STEM Lab", "Library", "Counselling"],
          address: "Near IT SEZ, Rushikonda, Visakhapatnam",
          phone: "+91 89123 45001",
          website: "oakridge.in",

        },
        {
          id: "timpany",

          locality: "Asilmetta",
          distance: "1.8 km",
          rating: 4.7,
          fees: "₹85K - ₹1.7L",
          status: "Limited Seats",
          tagline: "Heritage academics with strong values",
          image: "https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=1400&auto=format&fit=crop",
          gallery: [
            "https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1503676260728-1c00da094a0b?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?q=80&w=1200&auto=format&fit=crop"
          ],
          facilities: ["Library", "Transport", "Sports Complex", "Cafeteria", "Counselling"],
          address: "Asilmetta Junction, Visakhapatnam",
          phone: "+91 89127 84012",
          website: "timpanyschool.in",
          grades: "LKG - Grade 12",
          ratio: "18:1"
        },
        {
          id: "dps",
          name: "Delhi Public School Vizag",
          board: "CBSE",
          locality: "Anandapuram",
          distance: "9.4 km",
          rating: 4.6,
          fees: "₹1.2L - ₹2.6L",
          status: "Open",
          tagline: "Future-focused CBSE campus near the city edge",
          image: "https://images.unsplash.com/photo-1588072432836-e10032774350?q=80&w=1400&auto=format&fit=crop",
          gallery: [
            "https://images.unsplash.com/photo-1519452575417-564c1401ecc0?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1200&auto=format&fit=crop"
          ],
          facilities: ["Smart Classes", "Transport", "STEM Lab", "Sports Complex", "Swimming", "Library"],
          address: "Anandapuram, Visakhapatnam",
          phone: "+91 89129 33020",
          website: "dpsvisakhapatnam.org",
          grades: "Pre-KG - Grade 12",
          ratio: "15:1"
        },
        {
          id: "visakha",
          name: "Visakha Valley School",
          board: "State Board",
          locality: "Hanumanthawaka",
          distance: "4.1 km",
          rating: 4.4,
          fees: "₹45K - ₹95K",
          status: "Limited Seats",
          tagline: "Iconic campus beside Kailasagiri hills",
          image: "https://images.unsplash.com/photo-1568792923760-d70635a89fdc?q=80&w=1400&auto=format&fit=crop",
          gallery: [
            "https://images.unsplash.com/photo-1503676382389-4809596d5290?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1564981797816-1043664bf78d?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1200&auto=format&fit=crop"
          ],
          facilities: ["Transport", "Sports Complex", "Library", "Counselling"],
          address: "Near Kailasagiri, Hanumanthawaka",
          phone: "+91 89127 22551",
          website: "visakhavalleyschool.edu.in",
          grades: "LKG - Grade 10",
          ratio: "20:1"
        }
      ];

      const categories = ["CBSE", "ICSE", "State Board", "International"];
      const app = document.getElementById("app");
      const tabs = document.getElementById("tabs");
      let onboardingIndex = 0;

      function logo(size = "") {
        return `
          <div class="logo-row">
            <div class="logo-mark ${size}">VS</div>
            <div>
              <p class="brand-title">Vizag Schools</p>
              <p class="brand-subtitle">Find the right fit</p>
            </div>
          </div>
        `;
      }

      function schoolCard(school) {
        return `
          <article class="school-card" onclick="renderDetail('${school.id}')">
            <div class="school-img">
              <img src="${school.image}" alt="${school.name}" />
              <button class="save" aria-label="Save ${school.name}">♡</button>
            </div>
            <div class="school-body">
              <div class="school-top">
                <h3>${school.name}</h3>
                <p class="fees">${school.fees}</p>
              </div>
              <p class="muted" style="margin-top: 5px">${school.tagline}</p>
              <div class="meta">
                <span>★ ${school.rating}</span>
                <span>${school.board}</span>
                <span>${school.locality}</span>
                <span>${school.distance}</span>
              </div>
            </div>
          </article>
        `;
      }

      function setTabs(active) {
        tabs.style.display = ["home", "search", "favorites", "profile"].includes(active) ? "grid" : "none";
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.screen === active);
        });
      }

      function setScreen(html, active = "") {
        app.innerHTML = html;
        setTabs(active);
      }

      function renderSplash() {
        setScreen(`
          <section class="screen active splash">
            <div style="text-align:center">
              <div class="logo-row" style="justify-content:center; flex-direction:column">
                <div class="logo-mark">VS</div>
                <h1 style="margin-top:18px">Vizag Schools</h1>
                <p class="lead">Discover trusted schools in Visakhapatnam</p>
              </div>
            </div>
          </section>
        `);
        setTimeout(renderOnboarding, 900);
      }

      function renderOnboarding() {
        const slides = [
          ["Find schools that fit your child", "Explore boards, localities, ratings, facilities, and fees without jumping across dozens of websites.", "⌕"],
          ["Compare smarter before you visit", "Shortlist schools side by side with fees, admission status, transport, ratios, and campus strengths.", "⇄"],
          ["Explore admissions with confidence", "Track open seats, call the school, view location, and save favorites for your family discussion.", "✦"]
        ];
        const slide = slides[onboardingIndex];
        setScreen(`
          <section class="screen active">
            <div class="topbar">
              <span></span>
              <button class="link-btn" onclick="renderLogin()">Skip</button>
            </div>
            <div class="onboarding-art">${slide[2]}</div>
            <h1 style="margin-top:34px;text-align:center">${slide[0]}</h1>
            <p class="lead" style="text-align:center">${slide[1]}</p>
            <div class="dots">
              ${slides.map((_, i) => `<span class="dot ${i === onboardingIndex ? "active" : ""}"></span>`).join("")}
            </div>
            <button class="primary-btn" onclick="nextOnboarding()">${onboardingIndex === 2 ? "Get started" : "Next"}</button>
          </section>
        `);
      }

      function nextOnboarding() {
        if (onboardingIndex < 2) {
          onboardingIndex += 1;
          renderOnboarding();
        } else {
          renderLogin();
        }
      }

      function renderLogin() {
        setScreen(`
          <section class="screen active">
            ${logo()}
            <h1 style="margin-top:52px">Welcome back</h1>
            <p class="lead">Continue discovering the best schools across Visakhapatnam.</p>
            <div class="form">
              <input class="input" placeholder="Email" />
              <input class="input" placeholder="Password" type="password" />
              <button class="primary-btn" onclick="renderHome()">Login</button>
              <div class="divider">or</div>
              <button class="outline-btn" onclick="renderHome()">Continue with Google</button>
              <button class="link-btn" onclick="renderSignup()">New here? Create an account</button>
            </div>
          </section>
        `);
      }

      function renderSignup() {
        setScreen(`
          <section class="screen active">
            ${logo()}
            <h1 style="margin-top:42px">Create your parent profile</h1>
            <p class="lead">Save schools, compare options, and track admission updates in one place.</p>
            <div class="form">
              <input class="input" placeholder="Full name" />
              <input class="input" placeholder="Email" />
              <input class="input" placeholder="Password" type="password" />
              <input class="input" placeholder="Child grade" />
              <button class="primary-btn" onclick="renderHome()">Create account</button>
              <button class="link-btn" onclick="renderLogin()">Already have an account? Login</button>
            </div>
          </section>
        `);
      }

      function renderHome() {
        setScreen(`
          <section class="screen active">
            <div class="topbar">
              ${logo("small")}
              <button class="icon-btn" aria-label="Notifications">◌</button>
            </div>
            <h1>Find the perfect school in Vizag</h1>
            <p class="lead">Compare boards, fees, ratings, distance, and admission status.</p>
            <label class="search">
              <span>⌕</span>
              <input placeholder="Search schools, locality, board" onfocus="renderSearch()" />
              <span class="filter">☰</span>
            </label>
            <div class="hero-card">
              <div>
                <small>Admission pulse</small>
                <h2>37 schools are accepting applications this week</h2>
              </div>
              <strong style="font-size:30px">↗</strong>
            </div>
            <div class="section-title"><h2>Featured schools</h2><button class="link-btn" onclick="renderListing()">See all</button></div>
            <div class="h-scroll">
              ${schools
                .slice(0, 3)
                .map(
                  (school) => `
                <article class="featured" onclick="renderDetail('${school.id}')">
                  <img src="${school.image}" alt="${school.name}" />
                  <div class="card-shade">
                    <span class="rating">★ ${school.rating}</span>
                    <div>
                      <p class="card-title">${school.name}</p>
                      <p>${school.board} • ${school.locality}</p>
                    </div>
                  </div>
                </article>`
                )
                .join("")}
            </div>
            <div class="section-title"><h2>Categories</h2></div>
            <div class="chips">
              ${categories.map((cat) => `<button class="chip" onclick="renderListing('${cat}')">${cat}</button>`).join("")}
            </div>
            <div class="section-title"><h2>Nearby schools</h2><button class="link-btn" onclick="renderListing()">See all</button></div>
            <div class="list">${schools.slice(1).map(schoolCard).join("")}</div>
          </section>
        `, "home");
      }

      function renderSearch() {
        setScreen(`
          <section class="screen active">
            <h1>Search schools</h1>
            <p class="lead">Find by name, board, locality, facility, or admission status.</p>
            <label class="search">
              <span>⌕</span>
              <input id="query" placeholder="CBSE near MVP" oninput="filterResults(this.value)" />
              <span class="filter">☰</span>
            </label>
            <div class="section-title"><h2>Recent searches</h2></div>
            <div class="chips">
              ${["CBSE near MVP", "Admissions open", "International schools", "Low fee schools"]
                .map((item) => `<button class="chip" onclick="filterResults('${item}')">${item}</button>`)
                .join("")}
            </div>
            <div class="section-title"><h2>Smart suggestions</h2></div>
            <div class="panel">
              ${["Best schools in Rushikonda", "ICSE schools near Asilmetta", "Schools with transport", "Grade 11 science"]
                .map((item) => `<p style="padding:12px 0;border-bottom:1px solid var(--border);font-weight:850">✦ ${item}</p>`)
                .join("")}
            </div>
            <div class="section-title"><h2>Recommended schools</h2></div>
            <div class="list" id="results">${schools.map(schoolCard).join("")}</div>
          </section>
        `, "search");
      }

      function filterResults(value) {
        const query = value.toLowerCase();
        const result = schools.filter((school) => `${school.name} ${school.board} ${school.locality}`.toLowerCase().includes(query));
        document.getElementById("results").innerHTML = (result.length ? result : schools).map(schoolCard).join("");
      }

      function renderListing(board = "") {
        const data = board ? schools.filter((school) => school.board === board) : schools;
        setScreen(`
          <section class="screen active">
            <div class="topbar">
              <button class="icon-btn" onclick="renderHome()">‹</button>
              <button class="icon-btn">☰</button>
            </div>
            <h1>${board || "Schools in Vizag"}</h1>
            <p class="lead">${data.length} curated schools</p>
            <label class="search">
              <span>⌕</span>
              <input placeholder="Search this list" />
              <span class="filter">☰</span>
            </label>
            <div class="section-title"><h2>Loading state</h2></div>
            <div class="skeleton"></div>
            <div class="section-title"><h2>School list</h2></div>
            <div class="list">${data.map(schoolCard).join("")}</div>
          </section>
        `);
      }

      function renderDetail(id) {
        const school = schools.find((item) => item.id === id) || schools[0];
        setScreen(`
          <section class="screen active">
            <div class="detail-hero">
              <img src="${school.image}" alt="${school.name}" />
              <div class="detail-copy">
                <div class="topbar">
                  <button class="icon-btn" onclick="renderHome()">‹</button>
                  <button class="icon-btn">♡</button>
                </div>
                <div>
                  <span class="rating">★ ${school.rating}</span>
                  <h1 style="margin-top:10px">${school.name}</h1>
                  <p class="lead" style="color:rgba(255,255,255,.86)">${school.tagline}</p>
                </div>
              </div>
            </div>
            <div class="quick-actions">
              <button class="action-card" onclick="renderCompare('${school.id}')">⇄<br />Compare</button>
              <button class="action-card">☎<br />Call</button>
              <button class="action-card">◎<br />Website</button>
            </div>
            <div class="info-strip">
              ${[
                ["Board", school.board],
                ["Fees", school.fees],
                ["Admissions", school.status],
                ["Ratio", school.ratio]
              ]
                .map((item) => `<div class="info-cell"><p class="label">${item[0]}</p><p class="value">${item[1]}</p></div>`)
                .join("")}
            </div>
            <div class="section-title"><h2>Gallery</h2></div>
            <div class="gallery">${school.gallery.map((img) => `<img src="${img}" alt="${school.name} gallery" />`).join("")}</div>
            <div class="section-title"><h2>School information</h2></div>
            <p class="lead">${school.name} is a ${school.board} school in ${school.locality}, serving ${school.grades}. Parents rate it highly for campus quality, academics, and student support.</p>
            <div class="section-title"><h2>Facilities</h2></div>
            <div class="facility-grid">${school.facilities.map((item) => `<span class="facility">${item}</span>`).join("")}</div>
            <div class="section-title"><h2>Fee structure</h2></div>
            <div class="panel"><h2 style="color:var(--primary)">${school.fees}</h2><p class="lead">Annual estimate. Confirm final fee split with the school office.</p></div>
            <div class="section-title"><h2>Contact details</h2></div>
            <div class="panel"><h3>${school.address}</h3><p class="lead">${school.phone} • ${school.website}</p></div>
            <div class="section-title"><h2>Map location</h2></div>
            <div class="map"><div><h2>${school.locality}</h2><p class="muted">Visakhapatnam, Andhra Pradesh</p></div></div>
          </section>
        `);
      }

      function renderCompare(id = "") {
        const selected = id ? [schools.find((item) => item.id === id), ...schools.filter((item) => item.id !== id).slice(0, 1)] : schools.slice(0, 2);
        setScreen(`
          <section class="screen active">
            <div class="topbar">
              <button class="icon-btn" onclick="renderHome()">‹</button>
            </div>
            <h1>Compare schools</h1>
            <p class="lead">Side-by-side decision view</p>
            <div class="compare-row" style="margin-top:22px">
              ${selected
                .map(
                  (school) => `
                <div class="compare-card">
                  <h3>${school.name}</h3>
                  <p class="muted">${school.locality}</p>
                  <p class="rating" style="margin:12px 0">★ ${school.rating}</p>
                  ${[
                    ["Board", school.board],
                    ["Fees", school.fees],
                    ["Grades", school.grades],
                    ["Ratio", school.ratio],
                    ["Admissions", school.status]
                  ]
                    .map((item) => `<div class="compare-line"><p class="label">${item[0]}</p><p class="value">${item[1]}</p></div>`)
                    .join("")}
                </div>`
                )
                .join("")}
            </div>
            <div class="section-title"><h2>Visual indicators</h2></div>
            <div class="panel">
              <p><strong>Best value</strong><br /><span class="muted">Strong fees-to-rating balance.</span></p>
              <p style="margin-top:16px"><strong>Premium campus</strong><br /><span class="muted">Oakridge leads on facilities and curriculum.</span></p>
              <p style="margin-top:16px"><strong>Admissions</strong><br /><span class="muted">Open seats are available this week.</span></p>
            </div>
          </section>
        `);
      }

      function renderFavorites() {
        setScreen(`
          <section class="screen active">
            <h1>Favorites</h1>
            <p class="lead">Saved schools for your family shortlist.</p>
            <div class="list" style="margin-top:22px">${schools.slice(0, 2).map(schoolCard).join("")}</div>
            <div class="empty">
              <h2>Empty state ready</h2>
              <p class="lead">When no schools are saved, this area becomes a focused discovery prompt.</p>
              <button class="primary-btn" style="margin-top:18px" onclick="renderListing()">Explore schools</button>
            </div>
          </section>
        `, "favorites");
      }

      function renderProfile() {
        setScreen(`
          <section class="screen active">
            <div class="hero-card">
              <div class="logo-mark" style="background:white;color:var(--primary)">RL</div>
              <div style="flex:1">
                <h2>Reethika Lola</h2>
                <p style="color:rgba(255,255,255,.8)">Parent profile • Grade 6 search</p>
              </div>
            </div>
            <div class="admin-grid">
              <div class="admin-card"><h2>12</h2><p class="muted">Saved</p></div>
              <div class="admin-card"><h2>4</h2><p class="muted">Compared</p></div>
            </div>
            <div class="section-title"><h2>Settings</h2></div>
            <div class="panel">
              <p style="padding:12px 0;border-bottom:1px solid var(--border)">Admission notifications</p>
              <p style="padding:12px 0;border-bottom:1px solid var(--border)">Dark mode ready</p>
              <p style="padding:12px 0;border-bottom:1px solid var(--border)">Privacy preferences</p>
              <p style="padding:12px 0;cursor:pointer;font-weight:900;color:var(--primary)" onclick="renderAdmin()">Admin dashboard</p>
            </div>
          </section>
        `, "profile");
      }

      function renderAdmin() {
        setScreen(`
          <section class="screen active">
            <div class="topbar">
              <button class="icon-btn" onclick="renderProfile()">‹</button>
            </div>
            <div class="hero-card" style="background:linear-gradient(135deg,#0f172a,#1e293b)">
              <div>
                <small>Today</small>
                <h2>18 admission leads need review</h2>
                <p style="color:rgba(255,255,255,.76)">Keep school profiles fresh with verified fees, images, contacts, and admission availability.</p>
              </div>
            </div>
            <div class="admin-grid">
              <div class="admin-card"><h2>133</h2><p class="muted">Schools</p></div>
              <div class="admin-card"><h2 style="color:var(--secondary)">37</h2><p class="muted">Open seats</p></div>
              <div class="admin-card"><h2 style="color:var(--accent)">428</h2><p class="muted">Images</p></div>
              <div class="admin-card"><h2>9</h2><p class="muted">Pending edits</p></div>
            </div>
            <div class="section-title"><h2>Quick actions</h2></div>
            ${["Add school", "Edit school", "Upload images", "Manage admissions"]
              .map((item) => `<div class="admin-action"><strong>${item}</strong><span>›</span></div>`)
              .join("")}
          </section>
        `);
      }

      tabs.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        const screen = button.dataset.screen;
        if (screen === "home") renderHome();
        if (screen === "search") renderSearch();
        if (screen === "favorites") renderFavorites();
        if (screen === "profile") renderProfile();
      });

      renderSplash();
    </script>
  </body>
</html>
